[package]
name = "alldebrid-download-client"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "AllDebrid torrent download client using a local pyLoad-ng backend"

[package.metadata.scryer]
official = true
plugin_id = "alldebrid"
catalog_versions = ["v3"]
# The current PDK emits open error codes, decoded by Scryer 0.21.21+.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/alldebrid"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/alldebrid"

[lib]
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-sdk = "3.18.0"
scryer-plugin-pdk = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.61"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = ["download-client"] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
