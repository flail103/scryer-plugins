[package]
name = "mediathekviewweb-indexer"
version = "0.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "MediathekViewWeb indexer for public German-language broadcaster media"

[package.metadata.scryer]
official = true
plugin_id = "mediathekviewweb"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/mediathekviewweb"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/mediathekviewweb"

[lib]
name = "mediathekviewweb_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = "3.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
