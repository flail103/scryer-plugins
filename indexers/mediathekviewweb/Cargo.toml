[package]
name = "mediathekviewweb-indexer"
version = "0.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "MediathekViewWeb indexer emitting HTTP-family releases with direct MP4 resources"

[package.metadata.scryer]
official = true
plugin_id = "mediathekviewweb"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/mediathekviewweb"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/mediathekviewweb"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
